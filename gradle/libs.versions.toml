[versions]
minestom = "2026.07.12-26.2"
kotlin = "2.4.0"
log4j = "2.26.1"
slf4j = "2.0.18"
junit = "5.10.0"
mockito = "5.20.0"
mockito-kotlin = "6.1.0"
kotlinx-coroutines = "1.11.0"

testballoon-plugin = "1.0.1-K2.4.0"
testballoon = "1.0.1-K2.4.0"

[libraries]
minestom = { group = "net.minestom", name = "minestom", version.ref = "minestom" }
minestomTesting = { group = "net.minestom", name = "testing", version.ref = "minestom" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
log4j-layout-template-json = { module = "org.apache.logging.log4j:log4j-layout-template-json", version.ref = "log4j" }
slf4j = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# used implicitly by kotlin-jvm convention plugin
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito-kotlin" }
testballoon-plugin = { group = "de.infix.testBalloon", name = "testBalloon-gradle-plugin", version.ref = "testballoon-plugin" }
testballoon-lib = { group = "de.infix.testBalloon", name = "testBalloon-framework-core", version.ref = "testballoon" }
testballoon-kotest = { group = "de.infix.testBalloon", name = "testBalloon-integration-kotest-assertions", version.ref = "testballoon" }

kotlinGradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

[bundles]
log4j-runtime = [
    "log4j-core",
    "log4j-slf4j2-impl",
    "log4j-layout-template-json",
]